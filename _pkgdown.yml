url: https://pwinskill.github.io/fleet

# Not on CRAN, and no released version: `mode: unreleased` says so on the
# version badge in the navbar.
development:
  mode: unreleased

template:
  bootstrap: 5
  light-switch: true
  # Conventional, quiet code colouring. The chrome carries the identity; a
  # neon syntax theme underneath a neon logo is one neon too many.
  theme: github-light
  theme-dark: github-dark
  bslib:
    # --- Type: a geometric display face over a workhorse text face ---
    heading_font: {google: "Space Grotesk"}
    base_font: {google: "Inter"}
    code_font: {google: "JetBrains Mono"}
    # --- Colour: measured from the logo. See the header of pkgdown/extra.scss
    #     for how, and for why only two of the six colours in it are used here.
    primary: "#6D28D9"                      # violet: links, buttons, active nav
    secondary: "#635D70"
    success: "#0F766E"
    info: "#6D28D9"
    warning: "#B45309"
    danger: "#BE123C"
    # --- Tighter shapes than the Bootstrap default ---
    border-radius: "0.5rem"
    btn-border-radius: "0.375rem"
    # --- White, so Bootstrap generates the light-navbar toggler icon; the bar
    #     itself follows the theme from extra.scss, which swaps the icon back
    #     in dark mode ---
    navbar-bg: "#FFFFFF"

navbar:
  structure:
    left:  [intro, reference, articles, news, contributing]
    right: [search, lightswitch, github]
  components:
    intro:
      text: Get started
      href: articles/fleet.html
    github:
      icon: fab fa-github
      href: https://github.com/pwinskill/fleet
      aria-label: GitHub repository
    contributing:
      text: Contributing
      href: CONTRIBUTING.html

home:
  title: fleet • a fast ODE twin of malariasimulation
  description: >
    A fast, deterministic mean-field (ODE) counterpart to the malariasimulation
    individual-based model of Plasmodium falciparum malaria, built on odin2 / dust2.
  sidebar:
    structure: [glance, links, citation, license, authors, dev]
    components:
      glance:
        title: At a glance
        text: >
          A single multi-decade run finishes in **seconds**, independent of
          population size. Feed it an unmodified `malariasimulation` parameter
          list and get `postie`-style outputs straight back.
articles:
- title: Articles
  navbar: ~
  contents:
  # Ordered as a reader meets them, not alphabetically. Learn the interface, then
  # what to watch out for, then the evidence that licenses it -- "can I trust
  # this?" comes before "what exactly is the ODE?" -- then the formal system,
  # with its argument-by-argument lookup table behind it.
  - fleet
  - using
  - comparison
  - model
  - parameters

reference:
- title: Run the model
  desc: >
    Simulate malaria transmission dynamics with the deterministic mean-field
    ODE model.
  contents:
  - run_simulation_ode
- title: Solver settings
  desc: >
    Numerical tolerances and the discretisation of the age grid, the Erlang lag
    chains and the prophylaxis compartments. Every default is the validated
    choice: change one only when you have a reason to.
  contents:
  - ode_tuning
- title: Age grid
  desc: >
    The default graded age discretisation used throughout the model.
  contents:
  - default_age_lower
- title: Package overview
  desc: >
    Background, scope, and pointers to the mean-field approximations.
  contents:
  - fleet-package
