url: https://pwinskill.github.io/blink

# Not on CRAN. Says so on the version badge, and see the sidebar note below:
# there is a DIFFERENT package called blink that is on CRAN.
development:
  mode: unreleased

template:
  bootstrap: 5
  light-switch: true
  # Colourful-but-legible syntax highlighting, in light and dark flavours.
  theme: arrow-light
  theme-dark: arrow-dark
  bslib:
    # --- Fun, friendly, readable type ---
    heading_font: {google: "Baloo 2"}      # rounded, cheerful display font
    base_font: {google: "Nunito Sans"}     # clean, highly legible body font
    code_font: {google: "Fira Code"}       # crisp monospace with ligatures
    # --- Core colours (sunset coral/amber + deep teal/indigo) ---
    primary: "#4338CA"                      # deep indigo: links, buttons, active nav
    secondary: "#0E7C7B"                    # deep teal accent
    success: "#0E9C92"
    info: "#0E7C7B"
    warning: "#F59E0B"
    danger: "#E5533F"
    # --- Rounded, friendly shapes ---
    border-radius: "0.6rem"
    btn-border-radius: "0.5rem"
    # --- A deep-indigo navbar in both light and dark (gradient added in SCSS) ---
    navbar-bg: "#312E81"

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [search, lightswitch, github]
  components:
    intro:
      text: Get started
      href: articles/blink.html
    github:
      icon: fab fa-github
      href: https://github.com/pwinskill/blink
      aria-label: GitHub repository

home:
  title: blink • a fast ODE twin of malariasimulation
  description: >
    A fast, deterministic mean-field (ODE) counterpart to the malariasimulation
    individual-based model of Plasmodium falciparum malaria, built on odin2 / dust2.
  # NOTE the structure says sourcelinks, not links, and that is deliberate.
  #
  # There is an unrelated package called blink on CRAN (Steorts, "Record
  # Linkage for Empirically Motivated Priors"). pkgdown's built-in `links`
  # component probes CRAN by package NAME at build time, gets a hit on that
  # one, and renders "View on CRAN" pointing at
  # https://cloud.r-project.org/package=blink: the front page of this site
  # would send readers to someone else's package. There is no setting that
  # turns the probe off (development.mode does not, checked against pkgdown
  # 2.2.0), and a `links:` entry under components is ignored because pkgdown
  # only reads components for names it has no default for. So the section is
  # rebuilt by hand under a name pkgdown has no default for, which is what
  # drops the CRAN link while keeping the two links that were worth having.
  #
  # If blink is ever published on CRAN, put `links` back and delete
  # sourcelinks.
  sidebar:
    structure: [glance, sourcelinks, citation, license, authors, dev]
    components:
      glance:
        title: At a glance
        text: >
          A single multi-decade run finishes in **seconds**, independent of
          population size. Feed it an unmodified `malariasimulation` parameter
          list and get `postie`-style outputs straight back.
      sourcelinks:
        title: Links
        text: |
          [Browse source code](https://github.com/pwinskill/blink)

          [Report a bug](https://github.com/pwinskill/blink/issues)

articles:
- title: Articles
  navbar: ~
  contents:
  - blink
  - model
  - comparison

reference:
- title: Run the model
  desc: >
    Simulate malaria transmission dynamics with the deterministic mean-field
    ODE model.
  contents:
  - run_simulation_ode
- title: Solver settings
  desc: >
    Numerical tolerances and the discretisation of the age grid, the Erlang lag
    chains and the prophylaxis compartments. Every default is the validated
    choice: change one only when you have a reason to.
  contents:
  - ode_tuning
- title: Age grid
  desc: >
    The default graded age discretisation used throughout the model.
  contents:
  - default_age_lower
- title: Package overview
  desc: >
    Background, scope, and pointers to the mean-field approximations.
  contents:
  - blink-package
