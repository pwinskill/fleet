url: https://pwinskill.github.io/fleet

# Not on CRAN and no released version: `mode: unreleased` says so on the version
# badge in the navbar.
development:
  mode: unreleased

# Bootstrap's defaults plus pkgdown/extra.scss, which is fleetcheck's theme.
# `navbar-bg` has to stay: Bootstrap picks the light or dark menu icon from it at
# compile time, which a stylesheet cannot reach. There is no light switch, so the
# site is light only, as fleetcheck's is; the `[data-bs-theme="dark"]` rules in
# extra.scss are kept for a light switch if one is wanted later.
template:
  bootstrap: 5
  bslib:
    navbar-bg: "#FFFFFF"

# Get started and Usage notes sit at the top level, where a reader looks first.
# The specification, the parameter reference and the function index are grouped
# under one Reference menu, rather than pkgdown's default of an Articles
# dropdown beside a top-level function reference.
navbar:
  structure:
    left:  [intro, using, evidence, lookup, news, contributing]
    right: [search, github]
  components:
    intro:
      text: Get started
      href: articles/fleet.html
    using:
      text: Usage notes
      href: articles/using.html
    evidence:
      text: IBM comparison
      href: https://pwinskill.github.io/fleetcheck/
    lookup:
      text: Reference
      menu:
      - text: Model specification
        href: articles/model.html
      - text: Parameter reference
        href: articles/parameters.html
      - text: -------
      - text: Functions
        href: reference/index.html
      - text: All articles
        href: articles/index.html
    github:
      icon: fab fa-github
      href: https://github.com/pwinskill/fleet
      aria-label: GitHub repository
    contributing:
      text: Contributing
      href: CONTRIBUTING.html

home:
  title: Mean-field counterpart to malariasimulation
  description: >
    A deterministic mean-field counterpart to the malariasimulation
    individual-based model of Plasmodium falciparum and P. vivax malaria,
    advanced one day at a time on the individual-based model's daily clock,
    built on odin2 and dust2.
  sidebar:
    structure: [links, citation, license, authors, dev]

articles:
- title: Articles
  navbar: ~
  contents:
  # In reading order: the interface, then what to watch out for, then the
  # formal system and its argument-by-argument reference. The comparison with
  # the IBM is a separate project, fleetcheck, linked from the navbar.
  - fleet
  - using
  - model
  - parameters

reference:
- title: Run the model
  desc: >
    Run the mean-field model on a `malariasimulation` parameter list.
  contents:
  - run_simulation_ode
- title: Discretisation settings
  desc: >
    The age grid, the prophylaxis chains' stage counts, the mosquito sub-steps
    per day and the *P. vivax* hypnozoite levels. Every default is the
    validated choice.
  contents:
  - ode_tuning
  - default_age_lower
- title: Package overview
  contents:
  - fleet-package
