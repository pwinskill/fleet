# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    # Skip the five-runner matrix for a docs-only or figures-only commit.
    # paths-ignore, not paths: a deny-list of what provably cannot break the
    # build stays correct when the package grows a new source directory.
    paths-ignore:
      - '**.md'
      - 'man/figures/**'
      - 'vignettes/**.png'
      - 'pkgdown/**'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'man/figures/**'
      - 'vignettes/**.png'
      - 'pkgdown/**'
      - 'docs/**'

name: R-CMD-check.yaml

permissions: read-all

# Supersedes an in-flight matrix when the same branch is pushed again, which on
# a private repo is the single biggest saving available: three pushes ten minutes
# apart would otherwise run three full matrices to completion.
concurrency:
  group: R-CMD-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

  # Is the compiled model still the model in inst/odin?
  #
  # inst/odin/malaria_ode.R is the source of truth, but the artifact the matrix
  # above compiles is the committed, generated src/malaria_ode.cpp (with
  # R/dust.R, R/cpp11.R, src/cpp11.cpp and inst/dust). Edit the odin model,
  # forget to regenerate, and all five runners compile the OLD model and pass;
  # so do the tests; and fleetcheck's drift check passes loudest of all,
  # printing "nothing moved" -- which reads as "my change was numerically inert"
  # rather than "my change was never compiled".
  #
  # So: regenerate from inst/odin and fail if the working tree comes out dirty.
  # One Ubuntu job, not a sixth matrix row -- the generated code is the same on
  # every platform, so checking it five times says nothing new. The package
  # itself is never built here: odin_package() only writes code, so the job is a
  # dependency install plus seconds. The install is hard dependencies only (see
  # below) -- dust2, monty and cpp11, which do compile because the Remotes pins
  # make them source builds, but not the Suggests tree behind them.
  generated-code:
    runs-on: ubuntu-latest
    name: generated code matches inst/odin

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Hard dependencies only. This job calls one generator and diffs the
          # result; it never loads malariasimulation, postie, knitr, rmarkdown or
          # testthat. Pulling the whole Suggests tree in (dependencies: '"all"',
          # which is the action's default) only means this guard can go red
          # because malariasimulation failed to build on a runner -- a false
          # alarm on the one job whose entire value is that a red means one
          # specific thing.
          #
          # So name what "hard" leaves out and the job actually needs: odin2,
          # which is what the step below calls, and the packages the generators
          # reach for that are only Suggests of odin2/dust2/cpp11 themselves --
          # pkgload for odin_package(), cpp11's own
          # Config/Needs/cpp11/cpp_register list, and withr (see below) --
          # which pak will not install on their behalf.
          #
          # odin2 is named by the GitHub ref DESCRIPTION's Remotes: already
          # uses, NOT as any::odin2. The any:: prefix is a standard, CRAN-style
          # ref: pkgdepends resolves it from repository metadata alone and never
          # consults GitHub or Remotes:, so any::odin2 on a package that is not
          # on CRAN fails at resolution ("Can't find package called
          # any::odin2") and the job dies during the dependency install.
          #
          # withr IS on CRAN, so any:: is right for it, but why it is here is
          # not obvious: odin_package() ends in cpp11::cpp_register(), whose
          # get_call_entries() wraps its scan in withr::with_collate("C", ...)
          # to make the CallEntries table locale-independent. withr is only a
          # Suggests of cpp11 and is not in cpp11's own
          # Config/Needs/cpp11/cpp_register list, so nothing in this job's
          # hard-dependency closure installs it; without it the job writes
          # cpp11.R and then fails with "there is no package called 'withr'".
          dependencies: '"hard"'
          extra-packages: |
            mrc-ide/odin2
            any::pkgload
            any::brio
            any::cli
            any::decor
            any::desc
            any::glue
            any::tibble
            any::vctrs
            any::withr
          needs: check

      - name: Regenerate the model from inst/odin
        run: Rscript -e 'odin2::odin_package(".")'
        shell: bash

      # A dirty tree means the committed generated files are behind
      # inst/odin/malaria_ode.R. It can also mean odin2 or dust2 moved: their
      # version is stamped into the header of every file they write, and pak
      # installs them from the Remotes pin at HEAD. Either way the fix is the
      # same -- regenerate and commit.
      #
      # git status --porcelain, not git diff: diff only compares against the
      # index, so a generated file that has never been committed is UNTRACKED
      # and invisible to it, and the guard passes on a tree that is missing a
      # file the build needs. status sees both. It must stay SCOPED to these
      # paths, though: setup-r-dependencies writes an untracked .github/pkg.lock
      # into the tree, so a bare git status --porcelain would fail every run.
      - name: The generated model must match inst/odin
        run: |
          dirty=$(git status --porcelain -- src R/dust.R R/cpp11.R inst/dust)
          if [ -n "$dirty" ]; then
            echo "$dirty"
            git diff -- src R/dust.R R/cpp11.R inst/dust
            echo "::error::the compiled model is stale. src/malaria_ode.cpp,"
            echo "::error::R/dust.R, R/cpp11.R and inst/dust are generated from"
            echo "::error::inst/odin/malaria_ode.R and no longer match it (or a"
            echo "::error::newly generated one was never committed), so a"
            echo "::error::build here would compile the old model. Run"
            echo "::error::odin2::odin_package('.') locally and commit the"
            echo "::error::regenerated files."
            exit 1
          fi
          echo "the generated model is up to date with inst/odin/malaria_ode.R"
        shell: bash
