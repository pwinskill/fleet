# Do the committed figures and tables still match the committed data?
#
# comparison/data/rep_*.csv and the figures drawn from it are both committed, so
# they can fall out of step: re-run the models, forget to re-render, and the
# article quotes numbers its own figures do not show. Nothing else notices.
#
# This re-renders from the committed CSVs and fails if the working tree comes out
# dirty. It runs no model, so what it costs is a dependency install plus seconds
# of rendering.

name: figures

on:
  workflow_dispatch:
  # Scoped to the things that can change what is drawn: the data, the renderers,
  # the style, or the constants they share.
  #
  # site_snapshot.json is on the list because summary_tables.R reads it and
  # writes its numbers straight into tables.md, so it is as much an input to
  # the render as the CSVs are. ibm_reference.json is written by the same
  # run_replicates.R pass that writes those CSVs; listing it keeps the
  # allow-list covering the whole committed dataset rather than part of it.
  push:
    branches: [main, master]
    paths:
      - 'comparison/data/rep_*.csv'
      - 'comparison/data/site_snapshot.json'
      - 'comparison/data/ibm_reference.json'
      - 'comparison/render_figures.R'
      - 'comparison/summary_tables.R'
      - 'comparison/theme.R'
      - 'comparison/constants.R'
  pull_request:
    paths:
      - 'comparison/data/rep_*.csv'
      - 'comparison/data/site_snapshot.json'
      - 'comparison/data/ibm_reference.json'
      - 'comparison/render_figures.R'
      - 'comparison/summary_tables.R'
      - 'comparison/theme.R'
      - 'comparison/constants.R'

permissions: read-all

concurrency:
  group: figures-${{ github.ref }}
  cancel-in-progress: true

jobs:
  figures:
    runs-on: ubuntu-latest
    name: figures match data

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Hard dependencies only, and the render's own stack named explicitly.
      # Without `dependencies:` the action defaults to '"all"', which pulls in
      # the whole Suggests tree: malariasimulation and postie, both GitHub
      # remotes that compile from source, for a job that loads neither. The two
      # scripts here read committed CSVs and JSON and draw pictures; nothing in
      # them calls the IBM, and nothing in them loads blink either, so the job
      # does not install the package under test at all.
      #
      # The list below is what the scripts actually reach for: dplyr and tidyr
      # in both, ggplot2 and patchwork via theme.R, scales and ragg in the
      # plotting, systemfonts for theme.R's font probe, jsonlite for
      # site_snapshot.json. hexbin is there for render_figures.R's geom_hex,
      # which draws only under CMP_REFRESH_SITES (CI never sets it, and that
      # branch also wants a validation checkout that is not part of this repo),
      # but it is seconds to install and it keeps a local re-draw working from
      # the same list.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::dplyr
            any::tidyr
            any::ggplot2
            any::patchwork
            any::scales
            any::hexbin
            any::ragg
            any::systemfonts
            any::jsonlite
          needs: check

      - name: Re-render the figures and tables from the committed data
        run: |
          Rscript comparison/render_figures.R
          Rscript comparison/summary_tables.R
        shell: bash

      # A PNG can differ byte-for-byte between machines from font hinting alone,
      # so compare the TEXT outputs strictly (they are plain text produced from
      # the same CSVs) and report figure changes without failing on them. A
      # figure that genuinely went stale will almost always show up as a changed
      # table too, because both are computed from the same rows.
      #
      # There are two text outputs, not one: summary_tables.R writes tables.md
      # and render_figures.R writes comparison/data/int_impact_summary.csv, both
      # committed. Leave the CSV out and it is the one committed output of this
      # harness that nothing checks.
      - name: The tables and the impact summary must match the data
        run: |
          if ! git diff --quiet -- comparison/data/tables.md comparison/data/int_impact_summary.csv; then
            echo "::error::comparison/data/tables.md or comparison/data/int_impact_summary.csv"
            echo "::error::is stale: re-run comparison/render_figures.R and"
            echo "::error::comparison/summary_tables.R and commit."
            git diff -- comparison/data/tables.md comparison/data/int_impact_summary.csv
            exit 1
          fi
          echo "tables.md and int_impact_summary.csv are up to date with the committed data"
        shell: bash

      - name: Report any figure that re-rendered differently
        if: always()
        run: |
          if git diff --quiet -- 'man/figures/cmp_*.png' 'vignettes/cmp_*.png'; then
            echo "figures are byte-identical to the committed ones"
          else
            echo "::warning::these figures re-rendered differently. Often just font"
            echo "::warning::rendering on another machine; if the data changed, re-run"
            echo "::warning::comparison/render_figures.R locally and commit."
            git diff --stat -- 'man/figures/cmp_*.png' 'vignettes/cmp_*.png'
          fi
        shell: bash
